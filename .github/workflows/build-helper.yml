# Build Helper workflow - Builds and packages binaries for Windows x64.
# Adapted for Windows x64 unsigned build.

name: Build Helper
run-name: Build Windows x64 ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' - Manual' || '' }}
on:
    workflow_dispatch:

env:
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    build-app:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Zig
              uses: mlugg/setup-zig@v2

            # General build dependencies
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: |
                      go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: "Set Version"
              id: set-version
              run: echo "WAVETERM_VERSION=$(task version)" >> "$GITHUB_OUTPUT"
              shell: bash

            - name: Build (Windows)
              run: task package
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              shell: powershell # electron-builder's Windows code signing package has some compatibility issues with pwsh, so we need to use Windows Powershell

            - name: Verify Windows Installer
              id: verify-installer
              shell: powershell
              run: |
                  Write-Host "Contents of make/ directory:"
                  Get-ChildItem -Path make -Recurse | Select-Object FullName, Length

                  $installers = Get-ChildItem -Path make -Include *.exe, *.msi -Recurse -File
                  if (-not $installers) {
                      Write-Error "No Windows installer (.exe or .msi) was generated in make/!"
                      exit 1
                  }
                  Write-Host "Found Windows installer(s):"
                  foreach ($inst in $installers) {
                      $hash = (Get-FileHash -Path $inst.FullName -Algorithm SHA256).Hash
                      Write-Host "  Name: $($inst.Name)"
                      Write-Host "  Size: $($inst.Length) bytes"
                      Write-Host "  SHA256: $hash"
                  }

            - name: Upload Windows Installer Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: wave-windows-x64-installer
                  path: |
                      make/*.exe
                      make/*.msi
                      make/*.zip
                  if-no-files-found: error
